services:
  - type: web
    name: telegram-usedesk-bridge
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: USEDESK_API_TOKEN
        sync: false
      - key: USEDESK_COMPANY_ID
        sync: false
      - key: USEDESK_CHAT_CHANNEL_ID
        sync: false
      - key: USEDESK_APP_ID
        sync: false
      - key: USEDESK_API_BASE_URL
        value: https://api.usedesk.ru
      - key: REPLY_TO_LAST_TELEGRAM_MESSAGE
        value: "false"
      - key: MEDIA_LINK_TTL_SECONDS
        value: "604800"
